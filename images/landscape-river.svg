<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A river winding through a forested mountain valley at dusk">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="hsl(210, 14%, 80%)"/>
      <stop offset="0.35" stop-color="hsl(30, 30%, 84%)"/>
      <stop offset="0.6" stop-color="hsl(28, 50%, 78%)"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="hsl(36, 45%, 86%)"/>
      <stop offset="1" stop-color="hsl(200, 12%, 62%)"/>
    </linearGradient>
    <symbol id="pine" viewBox="0 0 40 120">
      <path d="M20,0 L28,30 L24,30 L33,58 L27,58 L38,92 L23,92 L23,120 L17,120 L17,92 L2,92 L13,58 L7,58 L16,30 L12,30 Z"/>
    </symbol>
  </defs>

  <rect width="800" height="1200" fill="url(#sky2)"/>
  <circle cx="300" cy="600" r="58" fill="hsl(30, 60%, 80%)"/>

  <!-- Distant ridges -->
  <path d="M0,600 C120,560 220,590 330,565 C440,540 520,585 630,560 C710,542 770,560 800,555 L800,1200 L0,1200 Z" fill="hsl(30, 18%, 80%)"/>
  <path d="M0,670 C100,630 200,665 300,640 C420,610 500,660 600,632 C690,607 760,640 800,630 L800,1200 L0,1200 Z" fill="hsl(40, 12%, 70%)"/>
  <path d="M0,745 C120,705 230,742 340,712 C450,682 550,735 650,705 C720,684 770,705 800,700 L800,1200 L0,1200 Z" fill="hsl(80, 8%, 52%)"/>

  <!-- Valley floor -->
  <path d="M0,820 C150,790 300,815 450,800 C600,785 700,805 800,798 L800,1200 L0,1200 Z" fill="hsl(92, 11%, 38%)"/>

  <!-- River winding toward the viewer -->
  <path d="M372,805 C390,804 412,806 420,812 C440,830 380,850 360,880 C335,918 470,940 520,990 C570,1040 470,1090 430,1200 L250,1200 C300,1110 410,1060 380,1020 C350,980 250,950 290,890 C315,852 360,830 372,805 Z" fill="url(#water)"/>

  <!-- Forest banks -->
  <path d="M0,880 C80,860 170,880 250,900 C285,915 270,960 300,1000 C330,1045 300,1110 240,1200 L0,1200 Z" fill="hsl(92, 12%, 26%)"/>
  <path d="M800,870 C720,860 620,880 540,920 C505,940 560,985 560,1030 C560,1090 500,1140 470,1200 L800,1200 Z" fill="hsl(92, 12%, 26%)"/>

  <!-- Pines -->
  <g fill="hsl(100, 16%, 15%)">
    <use href="#pine" x="20" y="790" width="46" height="138"/>
    <use href="#pine" x="70" y="820" width="38" height="114"/>
    <use href="#pine" x="115" y="800" width="50" height="150"/>
    <use href="#pine" x="170" y="840" width="36" height="108"/>
    <use href="#pine" x="-10" y="900" width="70" height="210"/>
    <use href="#pine" x="60" y="940" width="62" height="186"/>
    <use href="#pine" x="140" y="990" width="56" height="168"/>
    <use href="#pine" x="600" y="800" width="44" height="132"/>
    <use href="#pine" x="645" y="820" width="38" height="114"/>
    <use href="#pine" x="690" y="790" width="50" height="150"/>
    <use href="#pine" x="745" y="815" width="44" height="132"/>
    <use href="#pine" x="610" y="920" width="64" height="192"/>
    <use href="#pine" x="690" y="900" width="74" height="222"/>
    <use href="#pine" x="560" y="1000" width="58" height="174"/>
  </g>
</svg>
